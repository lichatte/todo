<!DOCTYPE html>
<html>
    <head>
        <title>ToDo List!</title>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Quicksand|Handlee">
        <link rel="stylesheet" type="text/css" href="css/style.css">
        <meta name="viewport" content="width=device-width, initial-scale=1">
    </head>

    <body>
        <div class="container">
            <div class="row">
                <div class="main-col">
                    <h1 class="title">ToDo List</h1>
                    <h2 class="subtitle">Keep what you need to do in here!</h2>

                    <div class="todo-list">
                        <div class="todo-task">
                            <input type="checkbox" class="todo-task__check" />
                            <label for="task" class="todo-task__label">Double click to edit</label>
                            <input type="text" class="todo-task__input-text" id="task" placeholder="Go to store and buy...">
                            <div class="todo-task__actions">
                                <svg><use class="todo-task__actions--edit todo-task__action" href="images/sprite.svg?ca#pencil"></use></svg>
                                <svg><use class="todo-task__actions--edit todo-task__action" href="images/sprite.svg?ca#trash"></use></svg>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </body>

    <template id="todo-task">
        <div class="todo-task">
            <input type="checkbox" class="todo-task__check" />
            <label for="" class="todo-task__label">Double click to edit</label>
            <input type="text" class="todo-task__input-text" id="" placeholder="Go to store and buy...">
            <div class="todo-task__actions">
                <svg><use class="todo-task__actions--edit todo-task__action" href="images/sprite.svg?ca#pencil"></use></svg>
                <svg><use class="todo-task__actions--edit todo-task__action" href="images/sprite.svg?ca#trash"></use></svg>
            </div>
        </div>
    </template>

    <script type="module" src="js/task.js"></script>
    <script type="module" src="js/index.js"></script>
</html>
